name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly security scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout tiredvpn core
        uses: actions/checkout@v7
        with:
          repository: tiredvpn/tiredvpn
          path: tiredvpn-core

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: tiredvpn-core/go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build JNI libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-jni.sh --core-dir "$GITHUB_WORKSPACE/tiredvpn-core"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit Tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Core guard
        # Packaging must refuse a libtiredvpn.so nobody can trace to a core
        # revision; this runs the guard against fake libraries in a copy.
        run: ./scripts/test-core-guard.sh

  security_scan:
    runs-on: ubuntu-latest
    # Without this the job inherited the 6 h default: the NVD download has no
    # timeout of its own and, unauthenticated and with several runs at once,
    # sat in "in progress" for hours.
    timeout-minutes: 90
    # A newer push to the same branch makes the running scan pointless, and
    # parallel scans compete for the same NVD rate limit.
    concurrency:
      group: security-scan-${{ github.ref }}
      cancel-in-progress: true
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DEPENDENCY_CHECK_DATA: /home/runner/.cache/dependency-check-data
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      # The vulnerability database is downloaded once and then only updated:
      # every run restores the newest copy, and main saves it back.
      - name: Restore vulnerability database
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.cache/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      - name: Update vulnerability database
        id: nvd_update
        run: ./gradlew dependencyCheckUpdate
        timeout-minutes: 50
        continue-on-error: true

      # Only a database that finished updating is saved; a step cut off by
      # its timeout may leave a half-written one behind.
      - name: Save vulnerability database
        if: github.ref == 'refs/heads/main' && steps.nvd_update.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/.cache/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}

      # Report only, not a gate. failBuildOnCVSS = 9.0 trips on every run
      # (kotlin-compiler, and grpc/netty pulled in by AGP, all build-time
      # tooling), and continue-on-error swallows the failure, so this step
      # has never blocked anything. Read the uploaded report; making it a
      # real gate needs suppressions for the build classpath first.
      - name: OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        timeout-minutes: 20
        continue-on-error: true

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check
          # The plugin writes dependency-check-report.{html,json} straight
          # into reports/; the old dependency-check/ directory never existed,
          # so no report was ever uploaded.
          path: app/build/reports/dependency-check-report.*
          retention-days: 30

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
