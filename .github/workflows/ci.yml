name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly security scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # The core is pinned to the tag in CORE_VERSION. Without a ref the
      # checkout took whatever main held at build time, so the core inside a
      # release depended on when the tag was pushed, not on this repository.
      - name: Read pinned core version
        id: core
        run: |
          REF="$(tr -d '[:space:]' < CORE_VERSION)"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CORE_VERSION must hold a core tag like v1.2.3, got '$REF'"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout tiredvpn core
        uses: actions/checkout@v7
        with:
          repository: tiredvpn/tiredvpn
          ref: ${{ steps.core.outputs.ref }}
          path: tiredvpn-core

      - name: Check core version
        run: |
          WANT="${{ steps.core.outputs.ref }}"
          GOT="v$(tr -d '[:space:]' < tiredvpn-core/VERSION)"
          if [[ "$GOT" != "$WANT" ]]; then
            echo "Core checkout says $GOT, CORE_VERSION pins $WANT"
            exit 1
          fi

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: tiredvpn-core/go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build JNI libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-jni.sh --core-dir "$GITHUB_WORKSPACE/tiredvpn-core"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit Tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Core guard
        # Packaging must refuse a libtiredvpn.so nobody can trace to a core
        # revision; this runs the guard against fake libraries in a copy.
        run: ./scripts/test-core-guard.sh

  security_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: security-scan-${{ github.ref }}
      cancel-in-progress: true
    env:
      OSV_SCANNER_VERSION: v2.7.0
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # osv-scanner reads a lockfile and does not resolve Gradle itself. Lock
      # only releaseRuntimeClasspath: that is what ships in the APK. The
      # build classpath (kotlin-compiler, AGP and what they pull in) is
      # tooling, and scanning it is what kept the old OWASP gate red on
      # findings nobody could act on.
      - name: Lock the release runtime classpath
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath --write-locks -PwriteDependencyLocks > /dev/null

      - name: Install osv-scanner
        run: |
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSLO "$base/osv-scanner_linux_amd64"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          rm osv-scanner_linux_amd64 osv-scanner_SHA256SUMS

      # A gate, not a report: any known vulnerability in a shipped dependency
      # fails the job. The scheduled run catches advisories published after
      # the last push.
      - name: Scan shipped dependencies
        run: osv-scanner scan source --lockfile app/gradle.lockfile

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
